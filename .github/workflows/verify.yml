name: Verify site

# The published dashboard is generated by pipeline/render_site.py into the repository
# root (GitHub Pages serves this branch at `/`). This workflow is the guard that must
# pass before anything is published:
#   * every data-table row carries a source link
#   * every internal link and asset reference resolves
#   * no unformatted missing value reaches a table cell
#   * every table is captioned, every page footer carries the pinned commit
#   * no external CDN dependency
#
# Historical note: the earlier hand-written sites from parallel sessions were archived
# under archive/ (see COORDINATION.md); their guards (archive/arena-cbd229fe/check_site.py,
# tests/) are kept in the repository for reference and are not run here because the pages
# they validate are archived.
on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # api.github.com allows 60 unauthenticated requests/hour per IP; paired
      # push + pull_request verify runs share runner IP pools and were failing
      # ~50% of the time inside `make build`'s pinned-input downloads
      # (2026-11-19).  The token raises the limit; the fetched bytes stay
      # pinned by commit/blob SHA either way.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify pinned inputs — pass 1 (a generation run)
        # Two passes by construction, not by accident: a handful of registers count tracked files,
        # so a build that adds files changes the counts it just wrote. Pass 1 generates the files,
        # pass 2 converges the self-referential counts. `check_rebuild.py` below is what proves the
        # second pass reached a fixed point -- without it, drift like the 2026-11-19 reserve-list
        # capture (which committed a snapshot but not the tables derived from it) is invisible.
        run: make build
      - name: Verify pinned inputs — pass 2 (self-referential counts converge)
        run: make build
      - name: Regression tests
        run: make test
      - name: The committed tree must be a fixed point of its own generators
        run: python tests/check_rebuild.py
      - name: A rebuild must change nothing at all
        # Broader than check_rebuild.py on purpose: that script compares the tables under assets/
        # and data/processed/, not every tracked file. This step prints what moved BEFORE it fails,
        # so a red run names the files instead of only saying "drift".
        run: |
          git diff --exit-code || {
            echo "::error::a fresh build changed committed files:"
            git diff --stat
            exit 1
          }
          echo "no drift: a fresh build reproduces the committed tree byte for byte"
      - name: Report (do not fail on) untracked build artefacts
        if: always()
        run: |
          git status --porcelain | awk '$1=="??"' > /tmp/untracked.txt
          if [ -s /tmp/untracked.txt ]; then
            echo "::warning::a fresh build wrote untracked files (they are not published and do not block):"
            cat /tmp/untracked.txt
          else
            echo "no untracked artefacts"
          fi
