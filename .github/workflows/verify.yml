name: Verify static site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, arena/cbd229fe-korea1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Validate local links and sourced data-table rows
        run: python3 scripts/check_site.py
