name: Official Week 11 capture (raw bytes + hashes)

# Session arena/c83ada84-korea1, 2026-11-19.
#
# Why a new workflow rather than a `workflow_dispatch` on availability.yml: this
# project's token cannot create a dispatch event ("Resource not accessible by
# integration", HTTP 403, measured 2026-11-19T12:2xZ), so a push to a trigger path is
# the only manual handle. `paths` is limited to THIS file and the capture module, so the
# data commit this job makes cannot re-trigger itself.
#
# What it does: downloads the official Week 11 documents (injury report at both URL
# forms, both schedule URL forms, the November reserve list, and every game centre the
# schedule page prints), stores the bytes verbatim under
# data/live/official_2026_11_19/ with sha256 + clock time, and commits them. It never
# parses and never edits a published page.
#
# It also records, in the same commit, the shell output of the site rebuild that has been
# failing on the *availability* workflow since 2026-11-18T19:24Z, so that failure is
# diagnosable from the repository instead of from an unreadable Actions log (the log
# receiver returns EOF for these runs -- measured again on run 44523862105).

on:
  push:
    branches: ["arena/**", main]
    paths:
      - ".github/workflows/week11-capture.yml"
      - "pipeline/capture_official_2026_11_19.py"
  schedule:
    - cron: "47 13,19,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: week11-capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Capture the official Week 11 documents
        run: python pipeline/capture_official_2026_11_19.py

      - name: Diagnose the site rebuild (recorded, never published)
        # Builds a throwaway copy so the working tree stays exactly as the capture left it.
        # The rebuild that fails on the availability workflow is `make -o injuries site`;
        # this reproduces it and keeps the shell output in the repository.
        run: |
          set +e
          DEST=data/live/official_2026_11_19/diagnostics
          mkdir -p "$DEST"
          pip install -q -r requirements.txt >/dev/null 2>&1
          rm -rf /tmp/rebuild && cp -a . /tmp/rebuild
          cd /tmp/rebuild
          { echo "== make -o injuries site (offline rebuild of the committed capture) =="
            date -u +%Y-%m-%dT%H:%M:%SZ
            make -o injuries site 2>&1 | tail -80
            echo "make-site-exit=${PIPESTATUS[0]}"
          } > "/home/runner/work/Korea1/Korea1/$DEST/site_rebuild.log" 2>&1
          echo "--- tail of recorded log ---"
          tail -25 "/home/runner/work/Korea1/Korea1/$DEST/site_rebuild.log" || true

      - name: Commit the capture
        # Only the capture directory is staged, so a regenerated page can never be
        # published from a runner by accident. `--autostash` keeps the pull safe even if a
        # tool left the tree dirty (that is what failed run 44523862105, exit 128).
        run: |
          git config user.name "week11-capture-bot"
          git config user.email "week11-capture-bot@users.noreply.github.com"
          git add data/live/official_2026_11_19
          git diff --cached --quiet && { echo "no capture changes"; exit 0; }
          git commit -m "capture: official Week 11 documents, raw bytes + sha256 ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
