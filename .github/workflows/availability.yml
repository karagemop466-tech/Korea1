name: Availability tracker (injuries + depth charts)

# Reads the two official availability sources with no manual input:
#   https://www.nfl.com/injuries/  and each club's /team/depth-chart page,
# rebuilds the starter/backup deficiency table and availability.html, and commits the
# snapshot to the branch it ran on. See pipeline/fetch_availability.py for the rules.
on:
  schedule:
    # 11:17 and 23:17 UTC daily, plus 21:17 UTC Wed-Sat when practice and game statuses post.
    - cron: "17 11,23 * * *"
    - cron: "17 21 * * 3-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: availability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch official injury report and club depth charts
        run: python pipeline/fetch_availability.py
      # CS3 (arena/db6cd525-korea1, 2026-11-18): rebuild every page and table built from the captures,
      # not only the availability page. `make -o injuries` treats the injury-download target as up to
      # date, so the nfl.com fetch above is not repeated; every other step of `make site` is offline.
      - name: Rebuild every table and page built from the captures
        run: |
          make -o injuries site
      - name: Verify (row sources, links, captions) before publishing
        run: |
          make -o injuries verify
          python -m pytest -q tests/test_availability_tracker.py tests/test_live_verify.py
      - name: Commit snapshot
        run: |
          git config user.name "availability-bot"
          git config user.email "availability-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "availability: official snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
