name: Diag (arena/3e95bcb7-korea1)

# TEMPORARY diagnostic workflow for session arena/3e95bcb7-korea1 (removed
# before the final PR).  Why it exists: the scheduled Availability tracker and
# the gamebooks capture are both red on main, but the Actions log download is
# unreachable from the session sandbox (results-receiver.actions.githubusercontent.com
# is not an allowed host), so the failing command's output cannot be read any
# other way.  Annotations ARE readable through api.github.com, so both jobs
# below surface their findings as ::error:: annotations.
#
# Job A reproduces the Availability tracker exactly (fresh official capture,
# then `make -o injuries site`) and prints the failing command's tail.
# Job B fetches the official scores pages for weeks 9-11 with the capture's
# own HTTP helper and reports what the fixture-set cross-check regex matches,
# including a context window around every other-week match, so the defect can
# be pinned to a module of the page rather than guessed at.
on:
  push:
    branches: [arena/3e95bcb7-korea1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  availability-repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fresh official capture (same as the scheduled tracker)
        run: python pipeline/fetch_availability.py
      - name: Rebuild (same as the scheduled tracker) with failure surfacing
        shell: bash
        run: |
          set -o pipefail
          set +e
          make -o injuries site 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            {
              echo "make error lines:"
              grep -n "make: \*\*\*\|Error [0-9]\|error:" /tmp/build.log | tail -n 12 || echo "(none matched)"
              echo "---- last 60 lines ----"
              tail -n 60 /tmp/build.log
            } > /tmp/err.txt
            RC="$rc" python3 - <<'PY'
          import os, pathlib
          body = pathlib.Path("/tmp/err.txt").read_text(errors="replace")
          # GitHub truncates annotation messages to a few KB, so keep the END
          # of the log (the actual failure), not its beginning.
          if len(body) > 3600:
              body = "…TRUNCATED…\n" + body[-3500:]
          msg = body.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=availability rebuild failed (exit {os.environ['RC']})::{msg}")
          PY
            exit "$rc"
          fi
          echo "rebuild ok"
          # W1 second half: the committed suite must pass against a freshly
          # fetched capture, not just the build (pins verified by simulation;
          # this proves it against the real page).
          set +e
          python -m pytest tests/ -q --ignore=tests/check_rebuild.py \
            --ignore=tests/check_links.py --ignore=tests/check_sources.py 2>&1 | tee /tmp/pytest.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            {
              echo "pytest failing tests:"
              grep -E "^FAILED|^ERROR" /tmp/pytest.log | tail -n 30 || echo "(none matched)"
              echo "---- last 40 lines ----"
              tail -n 40 /tmp/pytest.log
            } > /tmp/err.txt
            RC="$rc" python3 - <<'PY'
          import os, pathlib
          body = pathlib.Path("/tmp/err.txt").read_text(errors="replace")
          if len(body) > 3600:
              body = "…TRUNCATED…\n" + body[-3500:]
          msg = body.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=fresh-capture pytest failed (exit {os.environ['RC']})::{msg}")
          PY
            exit "$rc"
          fi
          echo "pytest ok: $(tail -n 1 /tmp/pytest.log)"
      - name: Report the fresh capture shape
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, pathlib
          out = pathlib.Path("data/availability")
          def n(p):
              try:
                  with open(p, newline="", encoding="utf-8") as fh:
                      return sum(1 for _ in csv.reader(fh)) - 1
              except Exception as exc:
                  return f"ERR {exc}"
          s = json.loads((out / "summary.json").read_text()) if (out / "summary.json").exists() else {}
          print(f"::notice title=fresh capture shape::injuries.csv rows={n(out/'injuries.csv')} depth_charts.csv rows={n(out/'depth_charts.csv')} summary={s}")
          PY

  scores-crosscheck-forensics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch official scores + schedule pages and report cross-check matches
        shell: bash
        run: |
          python - <<'PY'
          import re, sys, pathlib
          sys.path.insert(0, "pipeline")
          from fetch_official_games import http_get, week_path_forms
          from official_payload import parse_schedule_payload, published_week
          from official_games import parse_schedule_page

          ANN = []
          def ann(title, body):
              body = body[:60000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              ANN.append(f"::error title={title}::{body}")

          for week in (9, 10, 11):
              # --- schedule side (exactly what the capture does) ---
              sched_slugs = set()
              sched_rows = 0
              pub = "?"
              for cand in week_path_forms(2026, week):
                  try:
                      body, code = http_get(cand)
                  except Exception as exc:
                      continue
                  if code != 200 or not body:
                      continue
                  html = body.decode("utf-8", "replace")
                  pub = published_week(html)
                  rows = parse_schedule_payload(html) or parse_schedule_page(html)
                  sched_rows = len(rows)
                  sched_slugs = {str(r.get("official_url", "")).rstrip("/").rsplit("/", 1)[-1] for r in rows}
                  sched_url = cand
                  if str(pub) == str(week):
                      break
              # --- scores side (exactly what the capture does) ---
              scores_url = f"https://www.nfl.com/scores/2026/week-{week}"
              sraw, scode = http_get(scores_url)
              html_s = sraw.decode("utf-8", "replace")
              hits = re.findall(r'href="(?:https://www\.nfl\.com)?/games/([^"?#]+)"', html_s)
              score_slugs = set(hits)
              def wk(slug):
                  m = re.search(r"-(?:reg|pre|post)-(\d+)$", slug)
                  return m.group(1) if m else "NONE"
              by_week = {}
              for s in score_slugs:
                  by_week.setdefault(wk(s), set()).add(s)
              other = sorted(s for s in score_slugs if wk(s) != str(week))
              missing = sorted(sched_slugs - score_slugs)
              extra_same_week = sorted(s for s in (score_slugs - sched_slugs) if wk(s) == str(week))
              # context around the first occurrence of each other-week slug (up to 5)
              ctx = []
              for s in other[:5]:
                  i = html_s.find(f'/games/{s}')
                  if i < 0:
                      ctx.append(f"  {s}: not found as a plain href")
                      continue
                  start = html_s.rfind("<", 0, i)
                  tag = html_s[start:min(i + 120, start + 400)].replace("\n", " ")
                  window = html_s[max(0, i - 3000):i]
                  tid = ""
                  for m2 in re.finditer(r'data-testid="([^"]{1,80})"', window):
                      tid = m2.group(1)
                  frag = html_s[max(0, i - 300):i + 150].replace("\n", " ")
                  ctx.append(f"  {s} | nearest preceding data-testid={tid!r} | enclosing markup: {tag!r} | …{frag}…")
              body = (
                  f"week {week}: schedule rows={sched_rows} published_week={pub} "
                  f"sched_slugs={len(sched_slugs)} | scores http={scode} distinct score hrefs={len(score_slugs)} "
                  f"raw hits={len(hits)} | score slugs by week-marker: "
                  + ", ".join(f"{k}:{len(v)}" for k, v in sorted(by_week.items()))
                  + f" | missing-from-scores={missing} | extra-same-week={extra_same_week} "
                  f"| other-week slugs={other}"
              )
              if ctx:
                  body += "\ncontext of other-week matches (raw html around first hits):\n" + "\n".join(ctx)
              ann(f"scores cross-check week {week}", body)
          print("\n".join(ANN))
          PY
