name: Diag (arena/d64e3029-korea1)

# TEMPORARY diagnostic workflow for session arena/d64e3029-korea1 (removed
# before the final PR).  Why it exists: Verify site's strict step
# "A rebuild must change nothing at all" fails on this branch while the same
# rebuild is byte-clean in the session sandbox, and the Actions log download is
# unreachable from the sandbox (results-receiver.actions.githubusercontent.com
# is not an allowed host).  Annotations ARE readable through api.github.com,
# so the job below runs the same build and surfaces the actual `git diff`
# (stat + first/last hunks) as a ::notice:: annotation.

on:
  push:
    branches: [arena/d64e3029-korea1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # W1 acceptance (V2 of arena/d64e3029-korea1): the scheduled Availability
  # tracker has been delayed ~8h by GitHub today (11:17 cron fired 19:29 UTC),
  # so reproduce its exact failing sequence here instead — fresh official
  # capture, then `make -o injuries site` — and surface the result either way.
  availability-tracker-repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fresh official capture (same as the scheduled tracker)
        run: python pipeline/fetch_availability.py
      - name: Rebuild with the fresh capture (same as the scheduled tracker)
        shell: bash
        run: |
          set +e
          make -o injuries site > /tmp/tracker.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            {
              echo "tracker rebuild failed (exit $rc); make error lines:"
              grep -n "make: \*\*\*\|Error [0-9]\|error:\|SystemExit" /tmp/tracker.log | tail -n 12 || true
              echo "---- last 50 lines ----"
              tail -n 50 /tmp/tracker.log
            } > /tmp/err.txt
            RC="$rc" python3 - <<'PY'
          import os, pathlib
          body = pathlib.Path("/tmp/err.txt").read_text(errors="replace")
          if len(body) > 3600:
              body = "…TRUNCATED…\n" + body[-3500:]
          msg = body.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=availability tracker repro failed (exit {os.environ['RC']})::{msg}")
          PY
            exit "$rc"
          fi
          echo "::notice title=availability tracker repro OK::fresh capture + make -o injuries site exited 0 on the runner (Week-11 rolling capture)"
      - name: Report the fresh capture shape
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, pathlib
          out = pathlib.Path("data/availability")
          def n(p):
              try:
                  with open(p, newline="", encoding="utf-8") as fh:
                      return sum(1 for _ in csv.reader(fh)) - 1
              except Exception as exc:
                  return f"ERR {exc}"
          s = json.loads((out / "manifest.json").read_text()) if (out / "manifest.json").exists() else {}
          print(f"::notice title=fresh capture shape::injuries.csv rows={n(out/'injuries.csv')} depth_charts.csv rows={n(out/'depth_charts.csv')} manifest keys={sorted(s)[:8]}")
          PY

  surface-rebuild-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Rebuild and surface the whole-tree diff
        shell: bash
        run: |
          set -o pipefail
          make build > /tmp/build.log 2>&1 || true
          git status --porcelain > /tmp/status.txt || true
          git diff --stat > /tmp/stat.txt || true
          git diff > /tmp/full.diff || true
          {
            echo "== make build tail =="
            tail -n 8 /tmp/build.log
            echo "== git status =="
            cat /tmp/status.txt
            echo "== git diff --stat =="
            cat /tmp/stat.txt
            echo "== git diff (head) =="
            python3 -c "import pathlib; d=pathlib.Path('/tmp/full.diff').read_text(errors='replace'); print(d[:4000] if len(d)<=4000 else d[:2000]+'\n…TRUNCATED…\n'+d[-1900:])"
          } > /tmp/diff.txt
          python3 - <<'PY'
          import pathlib
          body = pathlib.Path("/tmp/diff.txt").read_text(errors="replace")
          if len(body) > 6000:
              body = body[:2500] + "\n…TRUNCATED…\n" + body[-3400:]
          msg = body.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::notice title=rebuild diff on arena/d64e3029-korea1::{msg}")
          PY
          git diff --quiet || exit 1
          echo "no drift"
