# TEMPORARY DIAGNOSTIC — session arena/132e7ca2-korea1. Deleted before merge.
# check_rebuild.py exits 1 in GitHub Actions but the runner log cannot be
# downloaded from this environment, so the drift is posted as a PR comment
# where it can be read.
name: Debug rebuild drift

on:
  push:
    branches: [arena/132e7ca2-korea1]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Rebuild
        run: make build
      - name: Measure drift
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY' > /tmp/drift.md
          import io, json, subprocess, math
          import pandas as pd
          names = subprocess.check_output(["git","diff","--name-only","HEAD"],text=True).splitlines()
          targets = [n for n in names if n.startswith(("assets/","data/processed/"))
                     or n in ("data/sources_pbp.json","EXECUTIVE_SUMMARY.md") or n.endswith(".html")]
          print("### rebuild drift magnitudes")
          print("sha:", subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip())
          print("nproc:", __import__("os").cpu_count())
          print("```")
          for name in targets:
              old = subprocess.run(["git","show",f"HEAD:{name}"],capture_output=True).stdout
              new = open(name,"rb").read()
              if name.endswith(".json"):
                  a,b = json.loads(old), json.loads(new)
                  print(f"JSON {name}:")
                  for k in a:
                      if a[k]!=b.get(k): print(f"   {k}: {a[k]!r} -> {b.get(k)!r}")
                  continue
              if name.endswith(".html") or name.endswith(".md"):
                  import difflib
                  al = old.decode().splitlines(); bl = new.decode().splitlines()
                  d = [l for l in difflib.unified_diff(al,bl,lineterm="",n=0)][:14]
                  print(f"TEXT {name}: {'SAME' if not d else 'DRIFT'}")
                  for l in d: print("   ", l[:220])
                  continue
              try:
                  A = pd.read_csv(io.BytesIO(old)); B = pd.read_csv(io.BytesIO(new))
              except Exception as exc:
                  print(f"{name}: unreadable {exc}"); continue
              if list(A.columns)!=list(B.columns) or len(A)!=len(B):
                  print(f"{name}: SCHEMA/ROWS {len(A)}->{len(B)}"); continue
              worst = []
              for c in A.columns:
                  xa, xb = A[c].tolist(), B[c].tolist()
                  ma = mr = 0.0; ex = None
                  for x,y in zip(xa,xb):
                      try: fx,fy = float(x),float(y)
                      except (TypeError,ValueError):
                          if x!=y: worst.append((c,"TEXT",f"{x!r} -> {y!r}"))
                          continue
                      if math.isnan(fx) and math.isnan(fy): continue
                      d = abs(fx-fy); rel = d/max(abs(fx),abs(fy),1e-300)
                      if d>ma: ma, mr, ex = d, rel, (x,y)
                  if ma>0: worst.append((c, f"maxabs={ma:.3e} maxrel={mr:.3e}", f"{ex[0]!r} -> {ex[1]!r}"))
              print(f"CSV {name}: rows={len(A)}")
              for w in sorted(worst, key=lambda z: -len(z[1]))[:8]:
                  print(f"   {w[0]}: {w[1]}  e.g. {w[2][:120]}")
          print("```")
          PY
          gh pr comment 46 --body-file /tmp/drift.md
