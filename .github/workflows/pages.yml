name: Deploy dashboard

# HOW THIS REPO PUBLISHES
# GitHub Pages for this repository is configured as "deploy from branch main, /" (build_type:
# legacy, source.branch main, source.path /). GitHub itself rebuilds the site on every push to
# main, serving the generated pages from the repository root; that is the live site.
# See COORDINATION.md (IR-08) - this was verified against the Pages API, not assumed.
#
# This workflow is therefore a *gate*, not the publisher: it re-runs the checks on every push. The
# deploy job only ever runs when the repository's Pages source has been switched to "GitHub
# Actions" (build_type == workflow); on a legacy-configured repo actions/deploy-pages fails, and a
# permanently red workflow on a working site is worse than no workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python3 -m tests.check_links
      - run: python3 tests/check_sources.py
      - run: python3 pipeline/verify_site.py

  pages-source:
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.probe.outputs.build_type }}
    permissions:
      contents: read
      pages: read
    steps:
      - id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "Pages build_type: ${build_type}"
          echo "build_type=${build_type}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [verify, pages-source]
    if: needs.pages-source.outputs.build_type == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the published pages
        run: |
          mkdir -p site-build
          cp ./*.html site-build/
          cp -R assets site-build/
          cp .nojekyll site-build/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-build
      - id: deployment
        uses: actions/deploy-pages@v4
