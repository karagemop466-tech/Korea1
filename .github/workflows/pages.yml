name: Deploy NFL Line Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify links and sourced table rows
        run: python3 scripts/check_site.py
  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble public site artifact
        run: |
          mkdir -p site-build
          cp index.html site-build/
          cp -R assets pages site-build/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-build
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
