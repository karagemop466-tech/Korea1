name: Build and deploy dashboard

# The canonical dashboard is GENERATED by `python -m analysis.build_site` and written to the
# repository root (see COORDINATION.md, IR-08). This workflow only ever publishes those generated
# files; it never edits HTML.
#
# GitHub Pages for this repository is configured as "deploy from branch main, /" (build_type
# legacy). Pushes to main are therefore published by GitHub itself, and this workflow's deploy job
# is deliberately gated: actions/deploy-pages only runs when the repository's Pages source is
# actually "workflow". Attempting it on a legacy-configured site fails, which would leave a red
# build on every commit while the real site is fine.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every internal link, anchor and asset
        run: python3 tests/check_links.py
      - name: Check every table row links to a source
        run: python3 tests/check_sources.py

  pages-source:
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.probe.outputs.build_type }}
    permissions:
      contents: read
      pages: read
    steps:
      - id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "Pages build_type: ${build_type}"
          echo "build_type=${build_type}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [verify, pages-source]
    if: needs.pages-source.outputs.build_type == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the generated site
        run: |
          mkdir -p site-build
          cp index.html lines.html strategies.html parlays.html props.html \
             validation.html data.html verification.html flagged.html site-build/
          cp -R assets site-build/
          cp .nojekyll site-build/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-build
      - id: deployment
        uses: actions/deploy-pages@v4
