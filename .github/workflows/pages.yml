name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check local links
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          root = Path('docs')
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self, tag, attrs):
                  for k,v in attrs:
                      if k in ('href','src') and v and not v.startswith(('http://','https://','#','mailto:','tel:','data:','javascript:')): self.links.append(v.split('#')[0].split('?')[0])
          errors=[]
          for page in root.glob('*.html'):
              parser=Links(); parser.feed(page.read_text())
              for link in parser.links:
                  if link and not (page.parent / link).exists(): errors.append(f'{page}: missing {link}')
          if errors: raise SystemExit('\n'.join(errors))
          print('All local links resolve.')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
