name: Deploy NFL Line Lab (manual)

# Integration note (2026-11-01, session arena/ea02c4fb-korea1):
# GitHub Pages for this repository is configured as a *branch* build of `main` / (repository
# root) -- verified against GET /repos/karagemop466-tech/Korea1/pages, which returns
# {"build_type":"legacy","source":{"branch":"main","path":"/"}}. An earlier note in this file
# said `main` / `docs`; that was wrong (there is no docs/ in the tree) and a manual run would
# have published an empty site. This workflow is dispatch-only, so it cannot race the branch
# build; it now assembles the repository root, which is exactly what Pages serves.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Verify links and sourced table rows
        run: |
          pip install pandas numpy scipy
          python3 tests/check_links.py
          python3 tests/check_sources.py
          python pipeline/audit.py
          python pipeline/verify_site.py
  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble public site artifact
        run: |
          mkdir -p site-build
          # the root site (Pages serves main:/) plus the annex it links to
          cp -R *.html *.md .nojekyll assets lab site-build/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-build
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
